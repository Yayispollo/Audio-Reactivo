<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halftone Neón Orgánico – Supershape Visualizer</title>
  
  <!-- Tipografías elegantes desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIABLES CSS (Tema Dark Neón, Estructurado y Coherente)
       ========================================================================== */
    :root {
      --bg-color: #030303;
      --card-bg: rgba(9, 9, 11, 0.9);
      --card-border: rgba(39, 39, 42, 0.8);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-neon: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.25);
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
