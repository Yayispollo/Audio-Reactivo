<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halftone Neón Orgánico – Supershape Visualizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600&family=JetBrains+Mono:wght=500;700&family=Space+Grotesk:wght=500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIABLES CSS (Tema Dark Neón, Estructurado y Coherente)
       ========================================================================== */
    :root {
      --bg-color: #030303;
      --card-bg: rgba(9, 9, 11, 0.9);
      --card-border: rgba(39, 39, 42, 0.8);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-neon: #ff5500; 
      --accent-glow: rgba(255, 85, 0, 0.25);
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       2. DISEÑO VISUAL Y COMPONENTES
       ========================================================================== */
    #visualizer_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .controls-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 360px;
      max-width: calc(100vw - 48px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.82);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 18px;
      user-select: none;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-neon);
      animation: pulse 1.8s infinite;
    }

    header p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .audio-player-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px;
    }

    .audio-player-box label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 32px;
      outline: none;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
    }

    .control-number {
      font-family: var(--font-mono);
      color: var(--accent-neon);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: #1f1f22;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-neon);
      box-shadow: 0 0 6px var(--accent-neon);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: 6px;
    }

    .btn {
      background: var(--accent-neon);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #ff661b;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.4);
    }

    .welcome-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .welcome-card {
      background: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 420px;
      max-width: calc(100vw - 32px);
      padding: 32px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
    }

    .welcome-card h2 {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
  </style>
</head>
<body>

  <div class="welcome-modal" id="welcome_modal">
    <article class="welcome-card">
      <h2>HALTONE NEÓN ORGÁNICO</h2>
      <p>Debido a políticas del navegador, se requiere una interacción directa para iniciar los analizadores de Web Audio. Haz clic abajo para comenzar.</p>
      <button class="btn" style="width: 100%;" id="btn_enter">Iniciar Experiencia</button>
    </article>
  </div>

  <canvas id="visualizer_canvas"></canvas>

  <main class="controls-panel">
    <header>
      <h1>Rock and rule Core</h1>
      <p>Espectro de Fourier modulando una rejilla de medio tono neón.</p>
    </header>

    <section class="audio-player-box">
      <label for="music_element">Angel Song</label>
      <audio id="music_element" controls src="./audio/angel_song.mp3"></audio>
    </section>

    <section class="control-group">
      <div class="control-label">
        <label for="input_sensitivity">Sensibilidad</label>
        <span class="control-number" id="label_sensitivity">2.2x</span>
      </div>
      <input type="range" id="input_sensitivity" min="0.5" max="5.0" step="0.1" value="2.2">
    </section>

    <section class="control-group">
      <div class="control-label">
        <label for="input_spacing">Espaciado (Separación)</label>
        <span class="control-number" id="label_spacing">25px</span>
      </div>
      <input type="range" id="input_spacing" min="15" max="45" step="1" value="25">
    </section>

    <section class="control-group">
      <div class="control-label">
        <label for="input_lobes">Lóbulos (Parámetro M)</label>
        <span class="control-number" id="label_lobes">5.0</span>
      </div>
      <input type="range" id="input_lobes" min="0" max="16" step="1" value="5">
    </section>

    <footer class="button-group">
      <button class="btn" id="btn_reset">Limpiar Huellas</button>
    </footer>
  </main>

  <script>
    class PerlinNoise {
      constructor() {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
      }
      fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      lerp(t, a, b) { return a + t * (b - a); }
      grad(hash, x, y) {
        const h = hash & 7;
        const u = h < 4 ? x : y;
        const v = h < 4 ? y : x;
        return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
      }
      noise2D(x, y) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        const u = this.fade(x);
        const v = this.fade(y);
        const A = this.perm[X] + Y;
        const B = this.perm[X + 1] + Y;
        return this.lerp(v, this.lerp(u, this.grad(this.perm[A], x, y),
                                         this.grad(this.perm[B], x - 1, y)),
                             this.lerp(u, this.grad(this.perm[A + 1], x, y - 1),
                                         this.grad(this.perm[B + 1], x - 1, y - 1)));
      }
    }

    const perlin = new PerlinNoise();
    const canvas = document.getElementById('visualizer_canvas');
    const ctx = canvas.getContext('2d');
    const welcomeModal = document.getElementById('welcome_modal');
    const btnEnter = document.getElementById('btn_enter');
    const btnReset = document.getElementById('btn_reset');
    const musicElement = document.getElementById('music_element');

    const inputSensitivity = document.getElementById('input_sensitivity');
    const inputSpacing = document.getElementById('input_spacing');
    const inputLobes = document.getElementById('input_lobes');

    const labelSensitivity = document.getElementById('label_sensitivity');
    const labelSpacing = document.getElementById('label_spacing');
    const labelLobes = document.getElementById('label_lobes');

    // CONFIGURACIÓN OPTIMIZADA: Reducimos max/min size globales para estilizar los puntos
    const settings = {
      sensitivity: 2.2,
      spacing: 25,
      lobes: 5.0,
      scale: 280,
      maxSize: 12,  
      minSize: 1.2, 
      glow: 12
    };

    inputSensitivity.addEventListener('input', (e) => {
      settings.sensitivity = parseFloat(e.target.value);
      labelSensitivity.innerText = settings.sensitivity.toFixed(1) + 'x';
    });
    inputSpacing.addEventListener('input', (e) => {
      settings.spacing = Math.max(15, parseInt(e.target.value));
      labelSpacing.innerText = settings.spacing + 'px';
    });
    inputLobes.addEventListener('input', (e) => {
      settings.lobes = parseFloat(e.target.value);
      labelLobes.innerText = settings.lobes.toFixed(1);
    });
    btnReset.addEventListener('click', () => {
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let audioCtx, analyser, source, dataArray;
    let isInitialized = false;

    function initAudio() {
      if (isInitialized) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(musicElement);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.8;

      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      isInitialized = true;
    }

    btnEnter.addEventListener('click', () => {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      welcomeModal.style.opacity = 0;
      setTimeout(() => {
        welcomeModal.style.display = 'none';
      }, 400);
      
      musicElement.play().catch(err => console.log('Interacción inicial activa'));
    });

    function superformula(theta, m, n1, n2, n3, a = 1.0, b = 1.0) {
      const part1 = Math.pow(Math.abs(Math.cos((m * theta) / 4) / a), n2);
      const part2 = Math.pow(Math.abs(Math.sin((m * theta) / 4) / b), n3);
      return Math.pow(part1 + part2, -1 / n1);
    }

    function mapRange(val, inMin, inMax, outMin, outMax) {
      if (inMax === inMin) return outMin;
      return outMin + ((val - inMin) / (inMax - inMin)) * (outMax - outMin);
    }

    let lastTime = 0;
    let runTime = 0;

    function getAudioLevels() {
      if (!isInitialized) return { bass: 0, mid: 0, treble: 0, full: 0 };

      analyser.getByteFrequencyData(dataArray);
      let bassSum = 0, midSum = 0, trebleSum = 0, fullSum = 0;
      const bassLimit = 12;
      const midLimit = 75;

      for (let i = 0; i < dataArray.length; i++) {
        const val = (dataArray[i] / 255) * settings.sensitivity;
        fullSum += val;
        if (i < bassLimit) bassSum += val;
        else if (i < midLimit) midSum += val;
        else trebleSum += val;
      }

      return {
        bass: Math.min(1.0, bassSum / bassLimit),
        mid: Math.min(1.0, midSum / (midLimit - bassLimit)),
        treble: Math.min(1.0, trebleSum / (dataArray.length - midLimit)),
        full: Math.min(1.0, fullSum / dataArray.length)
      };
    }

    function render(time) {
      const delta = (time - lastTime) * 0.001;
      lastTime = time;
      runTime += delta;

      let levels;
      if (isInitialized && !musicElement.paused) {
        levels = getAudioLevels();
      } else {
        const t = time * 0.0015;
        levels = {
          bass: (Math.sin(t) + 1) * 0.15 + (Math.cos(t * 0.6) + 1) * 0.12,
          mid: (Math.cos(t * 1.2) + 1) * 0.12 + (Math.sin(t * 0.4) + 1) * 0.10,
          treble: (Math.sin(t * 2.0) + 1) * 0.08 + (Math.cos(t * 1.5) + 1) * 0.08,
          full: 0.15
        };
        levels.full = (levels.bass + levels.mid + levels.treble) / 2.5;
      }

      const bassVal = Math.pow(levels.bass, 0.7) * settings.sensitivity;
      const midVal = Math.pow(levels.mid, 0.7) * settings.sensitivity;
      const fullVal = Math.pow(levels.full, 0.7) * settings.sensitivity;

      ctx.fillStyle = 'rgba(3, 3, 3, 0.16)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const halfW = canvas.width / 2;
      const halfH = canvas.height / 2;

      const dynamicScale = settings.scale * (1.1 + Math.pow(bassVal, 1.3) * 0.95 + midVal * 0.45);
      const rotationOffset = runTime * 0.15 + Math.sin(runTime * 0.4) * midVal * 1.5 + midVal * 1.15;
      const dynamicM = settings.lobes + Math.sin(runTime * 2.5) * (midVal * 2.8) + (Math.pow(levels.treble, 0.7) * settings.sensitivity * 1.8);

      const spacing = settings.spacing;
      const noiseScale = 0.012;
      const maxDisplacement = 60;

      if (settings.glow > 0) {
        ctx.shadowBlur = settings.glow;
      } else {
        ctx.shadowBlur = 0;
      }

      const totalColumns = Math.ceil(canvas.width / spacing);
      const totalRows = Math.ceil(canvas.height / spacing);
      let colCounter = 0;

      for (let x = -spacing; x < canvas.width + spacing; x += spacing) {
        let rowCounter = 0;
        colCounter++;

        for (let y = -spacing; y < canvas.height + spacing; y += spacing) {
          rowCounter++;

          const aproxDx = x - halfW;
          const aproxDy = y - halfH;
          const aproxDist = Math.hypot(aproxDx, aproxDy);
          if (aproxDist > dynamicScale * 1.6) continue;

          let particleAudioSample = 0;
          let audioIndex = 0;

          if (isInitialized && dataArray) {
            const particleID = (colCounter * rowCounter) + rowCounter;
            const totalParticlesEst = totalColumns * totalRows;
            audioIndex = Math.floor((particleID / totalParticlesEst) * dataArray.length) % dataArray.length;
            particleAudioSample = (dataArray[audioIndex] / 255) * settings.sensitivity;
          } else {
            particleAudioSample = (Math.sin(colCounter * 0.1 + runTime) * Math.cos(rowCounter * 0.1 + runTime) + 1) * 0.3;
            audioIndex = Math.floor(mapRange(aproxDist, 0, canvas.width, 0, 255)) % 256;
          }

          const pAudio = Math.pow(particleAudioSample, 0.8);

          const flowAngle = perlin.noise2D(x * noiseScale, y * noiseScale + runTime) * Math.PI * 2;
          const shift = perlin.noise2D(x * noiseScale + runTime, y * noiseScale) * maxDisplacement;

          // CORRECCIÓN 2: Atenuamos el empuje del ruido Perlin (multiplicadores rebajados) para no romper la figura
          const drawX = x + Math.cos(flowAngle) * shift * (1.0 + fullVal * 1.2 + bassVal * 0.8);
          const drawY = y + Math.sin(flowAngle) * shift * (1.0 + fullVal * 1.2 + bassVal * 0.8);

          const dx = drawX - halfW;
          const dy = drawY - halfH;
          const distance = Math.hypot(dx, dy);
          const rawTheta = Math.atan2(dy, dx);
          const theta = rawTheta - rotationOffset;

          const r_super = superformula(theta, dynamicM, 1.0, 1.7, 1.7);
          const edgeTurbulence = perlin.noise2D(Math.cos(rawTheta) * 1.5, Math.sin(rawTheta) * 1.5 + runTime) * 0.08;
          const finalSuperRadius = r_super * dynamicScale * (1.0 + edgeTurbulence * (1.0 + pAudio * 2.4) + pAudio * 0.55 + midVal * 0.35);

          const ratio = distance / finalSuperRadius;
          if (ratio > 1.25) continue;

          // CORRECCIÓN 1: Clamping/Sujeción del impacto del audio en el factor de escala Halftone
          let halftoneFactor = 0.0;
          const maxAudioInfluence = 0.5; 
          const audioContribution = Math.min(maxAudioInfluence, (fullVal * 0.8 + bassVal * 0.4));

          if (ratio <= 0.8) {
            halftoneFactor = mapRange(ratio, 0, 0.8, 1.0, 0.6) + audioContribution;
          } else {
            halftoneFactor = mapRange(ratio, 0.8, 1.25, 0.6 + audioContribution, 0.0);
          }

          const radius = settings.minSize + Math.max(0, halftoneFactor) * settings.maxSize;

          if (radius > 0.5) {
            let baseHue = 42 - (Math.min(1.0, ratio) * 42); 
            let audioColorShift = pAudio * 35; 
            let organicWave = Math.sin(runTime + audioIndex * 0.05) * 8; 

            let finalHue = baseHue + audioColorShift + organicWave;
            let color = `hsl(${finalHue}, 100%, 52%)`;

            ctx.beginPath();
            ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;

            if (settings.glow > 0 && radius > 4) {
              ctx.shadowColor = color; 
            } else {
              ctx.shadowColor = 'transparent'; 
            }

            ctx.fill();
          }
        }
      }

      ctx.shadowBlur = 0; 
      ctx.shadowColor = 'transparent';
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
